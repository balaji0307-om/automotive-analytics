# ============================================================
# Automotive Data Analytics Platform - Application Properties
# ============================================================

# Application name
spring.application.name=automotive-analytics

# Server port
server.port=8080

# ============================================================
# H2 In-Memory Database Configuration (local dev, no install needed)
# ============================================================
spring.datasource.url=jdbc:h2:mem:automotive_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=value
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Disable auto-run of data.sql (DataInitializer.java handles seeding)
spring.sql.init.mode=never

# ============================================================
# JPA / Hibernate Configuration
# ddl-auto=update: Hibernate creates/updates tables (H2 is fresh each JVM start)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# ============================================================
# Thymeleaf Configuration
# cache=false: Hot reload templates during development
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ============================================================
# Logging
# ============================================================
logging.level.com.automotive=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# Spring MVC - Custom error page mapping
# ============================================================
server.error.whitelabel.enabled=false
