<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Generate Report - Automotive Analytics</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">Automotive Analytics Platform</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/vehicles}">Vehicles</a>
        <a th:href="@{/analytics/fuel}">Analytics</a>
        <a th:href="@{/reports}">Reports</a>
        <a th:href="@{/search}">Search</a>
    </div>
    <div class="nav-user">
        <span>Welcome, <strong sec:authentication="name">User</strong></span>
        &nbsp;|&nbsp;
        <a th:href="@{/logout}" onclick="return confirm('Logout?')">Logout</a>
    </div>
</nav>

<div class="page-wrapper">
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a th:href="@{/dashboard}">&#9632; Dashboard</a></li>
            <li><a th:href="@{/vehicles}">&#9632; Vehicles</a></li>
            <li>
                <span class="sidebar-section">Analytics</span>
                <ul>
                    <li><a th:href="@{/analytics/fuel}">- Fuel</a></li>
                    <li><a th:href="@{/analytics/engine}">- Engine</a></li>
                    <li><a th:href="@{/analytics/environmental}">- Environment</a></li>
                </ul>
            </li>
            <li class="active"><a th:href="@{/reports}">&#9632; Reports</a></li>
            <li><a th:href="@{/search}">&#9632; Search</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2>Generate Report</h2>
            <a th:href="@{/reports}" class="btn btn-secondary">&#8592; Back to Reports</a>
        </div>

        <div class="detail-card" style="max-width: 500px;">
            <form th:action="@{/reports/generate}" method="post" id="generateForm"
                  onsubmit="return validateReportForm()">

                <div class="form-group">
                    <label for="vehicleId">Select Vehicle *</label>
                    <select name="vehicleId" id="vehicleId" required>
                        <option value="">-- Select a vehicle --</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.vehicleId}"
                                th:text="${v.vehicleNumber + ' - ' + v.manufacturer + ' ' + v.model}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reportType">Report Type *</label>
                    <select name="reportType" id="reportType" required>
                        <option value="">-- Select type --</option>
                        <option value="FUEL">Fuel Consumption</option>
                        <option value="ENGINE">Engine Behaviour</option>
                        <option value="ENVIRONMENTAL">Environmental Impact</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Generate Report</button>
                    <a th:href="@{/reports}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/validation.js}"></script>
</body>
</html>
