<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Automotive Analytics</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-header">
        <h1>Automotive Analytics</h1>
        <p>Data Analytics Platform</p>
    </div>

    <div class="login-form-box">
        <h2>Sign In</h2>

        <!-- Success message after logout -->
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out successfully.
        </div>

        <!-- Error message on bad credentials -->
        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password. Please try again.
        </div>

        <!-- Login form – action="/login" is handled by Spring Security -->
        <form method="post" th:action="@{/login}" id="loginForm" onsubmit="return validateLogin()">
            <!-- CSRF token is automatically inserted by Thymeleaf + Spring Security -->

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter username"
                       autocomplete="username"
                       required>
                <span class="field-error" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       autocomplete="current-password"
                       required>
                <span class="field-error" id="passwordError"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="login-hint">
            <small>
                Default credentials:<br>
                Admin: <strong>admin / admin123</strong><br>
                User: <strong>user / user123</strong>
            </small>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
